name: Dry-run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'install.m4'
      - 'ttis.sh'
      - 'tests/test-dry-run.sh'
      - 'tests/unit/test-planning.sh'
      - 'tests/test-generation.sh'
      - 'tests/run-docker-matrix.sh'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Dry-run build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate install.sh from install.m4
        run: |
          docker run --rm \
            -e PROGRAM=argbash \
            -v "$(pwd):/work" \
            -u "$(id -u):$(id -g)" \
            matejak/argbash \
            install.m4 -o install.sh

      - name: Inline ttis.sh into install.sh
        run: |
          scripts/inline-ttis.sh install.sh ttis.sh

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Run dry-run test suite
        run: |
          set -euo pipefail
          bash -n install.sh tests/test-dry-run.sh tests/unit/test-planning.sh tests/test-generation.sh tests/run-docker-matrix.sh
          shellcheck tests/test-dry-run.sh tests/unit/test-planning.sh tests/test-generation.sh tests/run-docker-matrix.sh
          bash tests/test-generation.sh
          bash tests/unit/test-planning.sh
          bash tests/test-dry-run.sh

  docker-matrix:
    name: Dry-run Docker matrix
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run multi-distro matrix
        run: |
          sudo apt-get update && sudo apt-get install -y jq shellcheck
          bash tests/run-docker-matrix.sh
