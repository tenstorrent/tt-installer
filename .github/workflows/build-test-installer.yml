name: Build and Test Installer

on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

# Read-only by default; jobs that need more (create-release) grant it explicitly.
permissions:
  contents: read

jobs:
  build:
    name: Build installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set version variables
        id: version
        run: |
          # Extract version with 'v' prefix for GitHub paths
          TAG_VERSION=${{ github.ref_name }}
          # Extract version without the 'v' prefix for script
          CLEAN_VERSION=$(echo $TAG_VERSION | sed 's/^v//')

          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Build install.sh
        # Stamps the version, compiles with a digest-pinned argbash image, and
        # inlines ttis.sh. Kept in a script so scripts/reproduce-release.sh can
        # rebuild release assets byte-for-byte from the tagged source.
        run: scripts/build-install-sh.sh "${{ steps.version.outputs.clean_version }}"

      - name: Upload install.sh as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-script
          path: install.sh

  # Validate the pinned golden .ttis files before the install tests consume them
  # via the 'release' channel. Mirrors golden-matrix.yml; the release tests gate
  # on this so they never run against an unvalidated golden baseline.
  validate-golden:
    name: Validate golden files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch golden files
        run: |
          set -euo pipefail
          PIN=$(grep -oP '(?<=TTIS_GOLDEN_VERSIONS_TAG=")[^"]+' install.m4)
          echo "Fetching tt-sw-manifest @ ${PIN}"
          mkdir -p golden
          curl -fsSL "https://api.github.com/repos/tenstorrent/tt-sw-manifest/releases/tags/${PIN}" \
            | jq -r '.assets[] | select(.name | endswith(".ttis")) | [.name, .browser_download_url] | @tsv' \
            | while IFS=$'\t' read -r name url; do
                curl -fsSL -o "golden/${name}" "${url}"
              done

      - name: Validate all golden files
        run: |
          set -euo pipefail
          failed=0
          for f in golden/*.ttis; do
            echo "── Validating $f ──"
            if bash ttis.sh validate "$f"; then
              echo "✓ $f"
            else
              echo "✗ $f"
              failed=$((failed + 1))
            fi
          done
          if [[ "$failed" -gt 0 ]]; then
            echo "::error::$failed golden file(s) failed validation"
            exit 1
          fi
          echo "All golden files are valid."

  # Release-channel tests: gate on validate-golden so they only run against a
  # verified golden baseline (the .ttis pinned by TTIS_GOLDEN_VERSIONS_TAG).
  test-debian-ubuntu:
    name: Test Debian/Ubuntu (release)
    needs: [build, validate-golden]
    uses: ./.github/workflows/test-debian-ubuntu.yml
    with:
      artifact_name: install-script
      channel: release

  test-fedora:
    name: Test Fedora (release)
    needs: [build, validate-golden]
    uses: ./.github/workflows/test-fedora.yml
    with:
      artifact_name: install-script
      channel: release

  test-hosted-n150:
    name: Test Hosted N150 (release)
    needs: [build, validate-golden]
    uses: ./.github/workflows/test-hosted-n150.yml
    with:
      artifact_name: install-script
      channel: release

  # Rolling-channel coverage: ensures "latest of everything" still installs.
  # Does not depend on the golden baseline.
  test-debian-ubuntu-rolling:
    name: Test Debian/Ubuntu (rolling)
    needs: build
    uses: ./.github/workflows/test-debian-ubuntu.yml
    with:
      artifact_name: install-script
      channel: rolling

  # Dogfood the composite CI action against the freshly built install.sh, with no
  # hardware: container mode skips KMD/HugePages/SFPI and firmware stays off.
  test-action-container:
    name: Test CI action (container mode)
    needs: [build, validate-golden]
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download install.sh
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: install-script

    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Run tt-installer action (container mode)
      id: tt
      uses: ./
      with:
        channel: release
        mode: container
        install-sh-path: ${{ github.workspace }}/install.sh
        export-schema-path: ${{ runner.temp }}/state.ttis
        upload-artifact: "false"

    - name: Validate exported schema
      run: |
        set -euo pipefail
        schema="${{ steps.tt.outputs.schema-path }}"
        test -f "${schema}" || { echo "::error::schema not written"; exit 1; }
        echo "✓ schema written to ${schema}"
        cat "${schema}"
        bash ttis.sh validate "${schema}"
        echo "✓ schema valid"

  # Version-argument precedence: an explicit --*-version argument must override
  # the version pinned by the release channel, while components without an
  # explicit argument keep the channel's pin. Installs (container mode, no
  # hardware) with a tt-smi version that differs from the golden pin, then
  # asserts both the exported schema and the installed package respect it.
  test-version-precedence:
    name: Test version argument precedence
    needs: [build, validate-golden]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download install.sh
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: install-script

    - name: Install jq
      run: |
        sudo apt-get update
        sudo apt-get install -y jq

    - name: Pick a tt-smi version that differs from the golden pin
      id: pick
      run: |
        set -euo pipefail
        PIN_TAG=$(grep -oP '(?<=TTIS_GOLDEN_VERSIONS_TAG=")[^"]+' install.m4)
        curl -fsSL -o golden.ttis \
          "https://github.com/tenstorrent/tt-sw-manifest/releases/download/${PIN_TAG}/ubuntu-24.04.ttis"
        golden_smi=$(jq -r '.tt_python["tt-smi"] // ""' golden.ttis)
        golden_flash=$(jq -r '.tt_python["tt-flash"] // ""' golden.ttis)
        echo "Golden pins: tt-smi='${golden_smi}', tt-flash='${golden_flash}'"

        # Newest tt-smi release on PyPI that is not the golden pin, so the
        # test never goes stale as the golden baseline moves. tt-smi and
        # tt-flash are coupled through pyluwen (each pins ~=0.X.0), and the
        # installer resolves both in one uv invocation — so only consider
        # tt-smi versions whose pyluwen series matches the golden tt-flash's,
        # or the override itself makes the install unsatisfiable.
        pyluwen_series() {
          # pyluwen_series <package> <version> — prints e.g. "0.8", or ""
          # if the release has no pyluwen requirement.
          curl -fsSL "https://pypi.org/pypi/$1/$2/json" \
            | jq -r '.info.requires_dist[]? | select(test("^pyluwen"))' \
            | grep -oP '[0-9]+\.[0-9]+' | head -1 || true
        }
        flash_series=$(pyluwen_series tt-flash "${golden_flash}")
        echo "tt-flash ${golden_flash} pyluwen series: '${flash_series}'"

        override=""
        while read -r candidate; do
          smi_series=$(pyluwen_series tt-smi "${candidate}")
          if [[ -z "${flash_series}" || -z "${smi_series}" || "${smi_series}" == "${flash_series}" ]]; then
            override="${candidate}"
            break
          fi
          echo "Skipping tt-smi ${candidate}: pyluwen series '${smi_series}' conflicts with tt-flash's '${flash_series}'"
        done < <(curl -fsSL https://pypi.org/pypi/tt-smi/json \
          | jq -r --arg g "${golden_smi}" '.releases | keys[] | select(. != $g) | select(test("^[0-9]+(\\.[0-9]+)*$"))' \
          | sort -rV | head -15)
        test -n "${override}" || { echo "::error::could not pick an override version compatible with tt-flash ${golden_flash}"; exit 1; }
        echo "Overriding tt-smi to ${override}"

        echo "golden_flash=${golden_flash}" >> "$GITHUB_OUTPUT"
        echo "override=${override}" >> "$GITHUB_OUTPUT"

    - name: Run installer with --versions=release and an explicit --smi-version
      # --use-uv makes this job also cover the pinned uv install: install_uv
      # downloads the pinned uv-installer.sh from GitHub and verifies it
      # against UV_INSTALLER_SHA256, so a stale hash (e.g. a bad bump-uv) or a
      # tampered asset fails here instead of on a user's machine.
      run: |
        set -euo pipefail
        timeout 900 bash install.sh \
          --mode-container \
          --mode-non-interactive \
          --use-uv \
          --versions=release \
          --smi-version=${{ steps.pick.outputs.override }} \
          --update-firmware=off \
          --no-install-metalium-container \
          --no-install-inference-server \
          --no-install-studio \
          --python-choice=new-venv \
          --github-token=${{ github.token }} \
          --export-schema "${RUNNER_TEMP}/state.ttis" \
          --reboot-option=never

    - name: Assert version precedence
      run: |
        set -euo pipefail
        schema="${RUNNER_TEMP}/state.ttis"
        override="${{ steps.pick.outputs.override }}"
        golden_flash="${{ steps.pick.outputs.golden_flash }}"

        test -f "${schema}" || { echo "::error::schema not written"; exit 1; }
        cat "${schema}"
        bash ttis.sh validate "${schema}"

        exported_smi=$(jq -r '.tt_python["tt-smi"]' "${schema}")
        if [[ "${exported_smi}" != "${override}" ]]; then
          echo "::error::tt-smi: expected override '${override}', schema records '${exported_smi}'"
          exit 1
        fi
        echo "✓ --smi-version override took precedence over the release pin (${exported_smi})"

        installed_smi=$("${HOME}/.tenstorrent-venv/bin/pip" show tt-smi | awk '/^Version:/{print $2}')
        if [[ "${installed_smi}" != "${override}" ]]; then
          echo "::error::tt-smi: expected installed version '${override}', got '${installed_smi}'"
          exit 1
        fi
        echo "✓ installed tt-smi is the override version (${installed_smi})"

        # A component without an explicit argument keeps the channel's pin.
        if [[ -n "${golden_flash}" ]]; then
          exported_flash=$(jq -r '.tt_python["tt-flash"]' "${schema}")
          if [[ "${exported_flash}" != "${golden_flash}" ]]; then
            echo "::error::tt-flash: expected golden pin '${golden_flash}', schema records '${exported_flash}'"
            exit 1
          fi
          echo "✓ tt-flash kept the release channel pin (${exported_flash})"
        else
          echo "tt-flash has no golden pin; skipping pin assertion"
        fi

  test-template-syntax:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Test template syntax
      run: |
        shellcheck -x install.m4
        echo "✓ Template syntax is valid"

  test-script-syntax:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download install.sh
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: install-script

    - name: Test script syntax
      # If this fails, we should be warned but not stop entirely
      continue-on-error: true
      run: |
        shellcheck install.sh
        echo "✓ Script syntax is valid"

  test-version-fetching:
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download install.sh
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: install-script

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y jq

    - name: Test version fetching functions
      run: |
        # Source the script to test the version fetching function
        set +e  # Don't exit on function failures

        # Extract and test the generic version fetching function
        source <(grep -A 30 "fetch_latest_version()" install.sh)
        source <(grep "TT_.*_GH_REPO=" install.sh)

        echo "Testing version fetch functions..."

        # Test KMD version fetching
        if kmd_ver=$(fetch_latest_version "${TT_KMD_GH_REPO}" "ttkmd-"); then
          echo "✓ KMD version fetched: $kmd_ver"
        else
          echo "⚠ KMD version fetch failed (may be rate limited)"
        fi

        # Test FW version fetching
        if fw_ver=$(fetch_latest_version "${TT_FW_GH_REPO}" "v"); then
          echo "✓ FW version fetched: $fw_ver"
        else
          echo "⚠ FW version fetch failed (may be rate limited)"
        fi

        # Test system tools version fetching
        if systools_ver=$(fetch_latest_version "${TT_SYSTOOLS_GH_REPO}" "v"); then
          echo "✓ System tools version fetched: $systools_ver"
        else
          echo "⚠ System tools version fetch failed (may be rate limited)"
        fi

        # Test SMI version fetching
        if smi_ver=$(fetch_latest_version "${TT_SMI_GH_REPO}"); then
          echo "✓ SMI version fetched: $smi_ver"
        else
          echo "⚠ SMI version fetch failed (may be rate limited)"
        fi

        # Test Flash version fetching
        if flash_ver=$(fetch_latest_version "${TT_FLASH_GH_REPO}"); then
          echo "✓ Flash version fetched: $flash_ver"
        else
          echo "⚠ Flash version fetch failed (may be rate limited)"
        fi

        echo "✓ Version fetching functions are working"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    # Only run if the build workflow completed successfully AND it was triggered by a version tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, validate-golden, test-debian-ubuntu, test-fedora, test-hosted-n150, test-debian-ubuntu-rolling, test-action-container, test-version-precedence]

    permissions:
      contents: write      # create the release and upload assets
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store the attestation on the repo
      pull-requests: read  # changelog builder lists merged PRs
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Pin the checkout to the exact commit the triggering tag pointed at
          # when the run started. (The previous `workflow_run.head_sha` here was
          # always empty on this push-triggered workflow, silently falling back
          # to the default ref.)
          ref: ${{ github.sha }}

      - name: Download artifacts from build workflow
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: install-script

      - name: Generate SHA256SUMS
        run: |
          sha256sum install.sh ttis.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        # Binds each asset's SHA-256 to this repo, commit, and workflow run via
        # Sigstore, so `gh attestation verify <asset> --repo <this repo>` proves
        # the asset was built here from the tagged commit — and a silently
        # replaced release asset fails verification.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            install.sh
            ttis.sh
            SHA256SUMS

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@c9dc8369bccbc41e0ac887f8fd674f5925d315f7 # v5.4.1
        with:
          mode: "HYBRID" # Include both PRs and direct commits
          configurationJSON: |
            {
              "template": "#{{CHANGELOG}}\n\n## Contributors\n#{{CONTRIBUTORS}}\n\n## Installation\n\nInstall this version with:\n```bash\n/bin/bash -c \"$(curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh)\"\n```\n\nLatest version can always be installed using:\n```bash\n/bin/bash -c \"$(curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install.sh)\"\n```\n\n## Verifying assets\n\nEvery asset carries a signed [build provenance attestation](https://github.com/${{ github.repository }}/attestations) binding it to this repository, the release workflow, and the tagged commit. To verify a downloaded asset:\n```bash\ngh attestation verify install.sh --repo ${{ github.repository }}\nsha256sum --check --ignore-missing SHA256SUMS\n```",
              "categories": [
                {
                  "title": "## 🔄 Changes",
                  "labels": []
                }
              ],
              "pr_template": "- #{{TITLE}} (#{{NUMBER}}) by @#{{AUTHOR}}",
              "commit_template": "- #{{TITLE}} (#{{MERGE_SHA}}) by @#{{AUTHOR}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            install.sh
            ttis.sh
            SHA256SUMS
          body: ${{ steps.build_changelog.outputs.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
